name: CI

on:
  # Solo master: las ramas pasan por su PR, y las etiquetas por release.yml, que ya llama a este flujo.
  push:
    branches: [master]
  pull_request:
  # Para una rama sin PR: Actions > CI > Run workflow (o `gh workflow run ci.yml --ref <rama>`).
  workflow_dispatch:
  # El flujo de publicación lo ejecuta antes de construir nada: si falla, no se publica.
  workflow_call:

permissions:
  contents: read

# Un push nuevo cancela el anterior de la misma ref. Llamado desde release.yml, `github.workflow` es el del que llama
# («Publicar versión»): otro grupo que el suyo y que el de un CI directo, y sin cancelar.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow == 'CI' }}

# En Windows se usa PowerShell y no el bash de Git: el wrapper `kotlin.bat` descarga su toolchain con `tar`, y el
# `tar` de GNU que trae Git interpreta «C:\ruta» como «máquina:ruta» y falla. Además se pone System32 el primero
# del PATH para que gane el `tar` de Windows (bsdtar).
jobs:
  # Las mismas pruebas del núcleo en los tres sistemas de escritorio. El adaptador de Windows se prueba con
  # órdenes simuladas, así que corre también en Linux y macOS; lo que solo se puede ver en Windows va aparte.
  tests:
    name: Pruebas (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest, shell: bash, kotlin: ./kotlin }
          - { name: macOS, os: macos-latest, shell: bash, kotlin: ./kotlin }
          - { name: Windows, os: windows-latest, shell: pwsh, kotlin: ./kotlin.bat }
    steps:
      - uses: actions/checkout@v4
      - name: Poner el tar de Windows primero
        if: runner.os == 'Windows'
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\Windows\System32"
      # El cliente OpenVPN propio se prueba contra el `openvpn` oficial (tools/ovpn_test_server.sh). En Windows no se
      # instala: esas pruebas se saltan solas si no lo encuentran.
      - name: OpenVPN de referencia
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq openvpn; else brew install openvpn; fi
          command -v openvpn || ls /opt/homebrew/sbin/openvpn /usr/local/sbin/openvpn 2>/dev/null
      # El motor Tailscale de Otro País: su librería nativa (Go, por JNI) y la red de pruebas (control, DERP y nodo de
      # salida). La prueba de punta a punta es obligatoria aquí: PROXYUCI_REQUIRE_TAILSCALE hace que falle si falta algo.
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/tsbridge/go.mod
          cache-dependency-path: tools/tsbridge/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Librería de Tailscale y red de pruebas
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tools/tsbridge/build.sh
          tools/tsbridge/build.sh testnet
      # En Windows, «bash» sería el de WSL (System32 va primero en el PATH): se usa el de Git.
      - name: Librería de Tailscale y red de pruebas (Windows)
        if: runner.os == 'Windows'
        run: |
          & "C:\Program Files\Git\bin\bash.exe" tools/tsbridge/build.sh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "C:\Program Files\Git\bin\bash.exe" tools/tsbridge/build.sh testnet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pruebas del núcleo
        env:
          PROXYUCI_REQUIRE_TAILSCALE: "1"
        run: ${{ matrix.kotlin }} test -m core --platform jvm
      - name: Pruebas del motor de escritorio
        run: ${{ matrix.kotlin }} test -m desktopEngine --platform jvm
      - name: Pruebas de la interfaz
        run: ${{ matrix.kotlin }} test -m shared --platform jvm
      # Que los documentos no apunten a enlaces ni rutas de código que ya no existen.
      - name: Documentos al día
        if: matrix.name == 'Linux'
        run: python3 tools/check_docs.py
      # El servicio de cuotas de la UCI, de mentira, contra el que se prueba la consulta de la cuota.
      - name: Simulador del servicio de cuotas
        if: matrix.name == 'Linux'
        run: python3 tools/test_cuotas_test.py

  # El puente de Tailscale por su lado: pruebas de Go (sesión por un proxy con autenticación, nodo de salida, clave mala)
  # y las librerías de Android, que se meten en un APK para comprobar que llegan a él.
  tsbridge:
    name: Tailscale (Go y Android)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Todo lo que descarga ./kotlin (su distribución, los JDK, los SDK y Maven) vive en JetBrains/Kotlin, en la
      # carpeta de cachés de cada sistema; ~/.gradle es del APK, que Amper construye con Gradle. Solo aquí y en el
      # .exe, donde ahorra minutos; en las pruebas no cambiaba el tiempo. Las rutas son las de release.yml, o no casa.
      - &cache-kotlin
        name: Caché del toolchain de Kotlin
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            ~/Library/Caches/JetBrains/Kotlin
            ~/AppData/Local/JetBrains/Kotlin
            !~/.cache/JetBrains/Kotlin/telemetry
            !~/Library/Caches/JetBrains/Kotlin/telemetry
            !~/AppData/Local/JetBrains/Kotlin/telemetry
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: kotlin-${{ runner.os }}-${{ github.job }}-${{ hashFiles('kotlin', 'kotlin.bat', 'project.yaml', 'libs.versions.toml', '*/module.yaml') }}
          restore-keys: kotlin-${{ runner.os }}-${{ github.job }}-
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/tsbridge/go.mod
          cache-dependency-path: tools/tsbridge/go.sum
      - name: Pruebas de Go
        working-directory: tools/tsbridge
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "Código de Go sin formatear"; exit 1; }
          go vet ./bridge ./testnet ./cmd/...
          go test ./bridge ./testnet -count=1 -timeout 300s -v 2>&1 | grep -v "tailscale:"
          exit ${PIPESTATUS[0]}
      - name: Librerías de Android
        run: |
          tools/tsbridge/build.sh android-arm64
          tools/tsbridge/build.sh android-x86_64
      - name: APK con las librerías
        run: |
          ./kotlin build -m androidApp
          apk=$(find build -name "*.apk" | head -1)
          unzip -l "$apk" | grep libtsbridge
          unzip -l "$apk" | grep -q "lib/arm64-v8a/libtsbridge.so"
          unzip -l "$apk" | grep -q "lib/x86_64/libtsbridge.so"

  # El túnel de verdad en Windows: adaptador Wintun real, `netsh` real, DNS del sistema y una descarga por el proxy
  # de pruebas. Los ejecutores de Windows corren como Administrador, que es lo que pide Wintun. Solo entran en el
  # túnel direcciones 192.0.2.0/24 (documentación) y la subred virtual: la conexión del ejecutor con GitHub no se toca.
  windows-tunnel:
    name: Túnel real (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Poner el tar de Windows primero
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\Windows\System32"
      - name: Administrador
        run: |
          $admin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          "Administrador: $admin"
          if (-not $admin) { throw "El ejecutor no corre como Administrador" }
      # Para «Otro País» con Tailscale sobre el adaptador real: la librería y la red de pruebas.
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/tsbridge/go.mod
          cache-dependency-path: tools/tsbridge/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # «bash» sería el de WSL (System32 va primero en el PATH): se usa el de Git.
      - name: Librería de Tailscale y red de pruebas
        run: |
          & "C:\Program Files\Git\bin\bash.exe" tools/tsbridge/build.sh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "C:\Program Files\Git\bin\bash.exe" tools/tsbridge/build.sh testnet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Los servidores de prueba y la prueba van en el MISMO paso: en los ejecutores de Windows los procesos que un
      # paso deja en segundo plano mueren al terminar ese paso (se comprobó: el paso siguiente ya no los encontraba).
      - name: Prueba del túnel, de las reglas de salida y de Tailscale (con su origen HTTP y su proxy NTLM)
        env:
          PROXYUCI_E2E_WINDOWS: "1"
        run: |
          $www = Join-Path $env:RUNNER_TEMP "www"
          python tools/e2e_fixture.py $www
          $env:PROXYUCI_E2E_BIG_SHA = (Get-Content (Join-Path $www "big.sha")).Trim()
          $proxyLog = Join-Path $env:RUNNER_TEMP "proxy.log"
          $proxyErr = Join-Path $env:RUNNER_TEMP "proxy.err"
          $servers = @()
          try {
            $servers += Start-Process python -PassThru -WindowStyle Hidden `
              -ArgumentList "-u","-m","http.server","8000","--bind","127.0.0.1","--directory",$www `
              -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP "origen.log") -RedirectStandardError (Join-Path $env:RUNNER_TEMP "origen.err")
            # -u: sin búfer; si no, Python no escribe su registro en el archivo hasta que acaba.
            $servers += Start-Process python -PassThru -WindowStyle Hidden `
              -ArgumentList "-u","tools/test_proxy.py","--auth","ntlm","--port","3128","--upstream","--redirect","127.0.0.1:8000" `
              -RedirectStandardOutput $proxyLog -RedirectStandardError $proxyErr
            Start-Sleep -Seconds 3
            $size = (Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8000/big.bin").RawContentLength
            if ($size -ne 5242880) { throw "El origen sirve $size bytes" }
            if (-not (Test-NetConnection 127.0.0.1 -Port 3128 -InformationLevel Quiet)) { throw "El proxy no escucha en 3128" }

            ./kotlin.bat test -m core --platform jvm --include-classes 'org.uci.proxy.core.windows.WindowsTunnelE2ETest'
            $code = $LASTEXITCODE
            # Las reglas de salida, en otro proceso: Windows no deja crear el adaptador dos veces en el mismo proceso
            # (error 52), y así se prueba además volver a conectar tras desconectar, como hace la app.
            ./kotlin.bat test -m core --platform jvm --include-classes 'org.uci.proxy.core.windows.WindowsSplitTunnelE2ETest'
            if ($code -eq 0) { $code = $LASTEXITCODE }
            # Otro País con Tailscale sobre el adaptador real, también en su propio proceso: el motor Tailscale de verdad
            # y una red de pruebas, con todo lo de Tailscale pasando por un proxy NTLM propio de la prueba.
            ./kotlin.bat test -m core --platform jvm --include-classes 'org.uci.proxy.core.windows.WindowsTailscaleE2ETest'
            if ($code -eq 0) { $code = $LASTEXITCODE }
          } finally {
            "--- registro del proxy de pruebas"
            Get-Content $proxyLog, $proxyErr -ErrorAction SilentlyContinue | Select-Object -Last 40
            $servers | ForEach-Object { Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue }
          }
          exit $code

  # El ProxyUCI.exe de un solo archivo: la app y una Java recortada dentro (ver tools/windows-exe/). Se prueba
  # ejecutándolo con --self-test, que arranca el mismo grafo del motor, carga JNA y extrae y verifica wintun.dll con
  # la Java recortada: un módulo de Java que falte aparece aquí y no cuando el usuario pulsa «Conectar».
  # build-exe.ps1 empieza con `kotlin.bat run -m desktopApp`: también prueba que el escritorio compila en Windows.
  windows-exe:
    name: ProxyUCI.exe (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - *cache-kotlin
      - name: Poner el tar de Windows primero
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\Windows\System32"
      # El bytecode de la app es de Java 25, y jdeps y jlink tienen que ser de esa misma versión.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/tsbridge/go.mod
          cache-dependency-path: tools/tsbridge/go.sum
      # El .exe lleva la librería de Tailscale; la autoprueba comprueba que carga con la Java recortada.
      - name: Librería de Tailscale
        run: |
          & "C:\Program Files\Git\bin\bash.exe" tools/tsbridge/build.sh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Construir el .exe
        run: ./tools/windows-exe/build-exe.ps1
      # Autoprueba (dos veces) y ventana de Compose con la Java recortada: ver tools/windows-exe/smoke-test.ps1.
      - name: Probar el .exe
        run: ./tools/windows-exe/smoke-test.ps1 -Exe build/exe/ProxyUCI.exe
      # Los servidores de prueba y la prueba van en el MISMO paso: los procesos que un paso deja en segundo plano
      # mueren al terminar ese paso.
      - name: Túnel real con el .exe como motor
        if: ${{ !cancelled() }}
        run: |
          $www = Join-Path $env:RUNNER_TEMP "www"
          python tools/e2e_fixture.py $www
          $env:PROXYUCI_E2E_BIG_SHA = (Get-Content (Join-Path $www "big.sha")).Trim()
          $env:PROXYUCI_E2E_EXE = (Resolve-Path build/exe/ProxyUCI.exe).Path
          $proxyLog = Join-Path $env:RUNNER_TEMP "proxy-exe.log"
          $proxyErr = Join-Path $env:RUNNER_TEMP "proxy-exe.err"
          $servers = @()
          try {
            $servers += Start-Process python -PassThru -WindowStyle Hidden `
              -ArgumentList "-u","-m","http.server","8000","--bind","127.0.0.1","--directory",$www `
              -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP "origen-exe.log") -RedirectStandardError (Join-Path $env:RUNNER_TEMP "origen-exe.err")
            $servers += Start-Process python -PassThru -WindowStyle Hidden `
              -ArgumentList "-u","tools/test_proxy.py","--auth","ntlm","--port","3128","--upstream","--redirect","127.0.0.1:8000" `
              -RedirectStandardOutput $proxyLog -RedirectStandardError $proxyErr
            Start-Sleep -Seconds 3
            if (-not (Test-NetConnection 127.0.0.1 -Port 3128 -InformationLevel Quiet)) { throw "El proxy no escucha en 3128" }

            ./kotlin.bat test -m desktopEngine --platform jvm --include-classes 'org.uci.proxy.desktop.WindowsPackagedExeE2ETest'
            $code = $LASTEXITCODE
          } finally {
            "--- registro del proxy de pruebas"
            Get-Content $proxyLog, $proxyErr -ErrorAction SilentlyContinue | Select-Object -Last 40
            $servers | ForEach-Object { Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue }
          }
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: ProxyUCI-windows-x64
          path: build/exe/ProxyUCI.exe
          retention-days: 14
