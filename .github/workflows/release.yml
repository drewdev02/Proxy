name: Publicar versión

# Al subir una etiqueta vX.Y.Z (por ejemplo v0.1.0) se pasan las pruebas, se construyen el APK de Android, el .exe de
# Windows y el .dmg de macOS (Apple Silicon) con esa versión, y se crea la Release de GitHub con los tres archivos,
# su SHA256SUMS.txt y una atestación de procedencia. Una etiqueta con guion (v0.1.0-rc1) sale como pre-release.
#
# Para publicar:   git tag v0.1.0 && git push origin v0.1.0
# Para ensayar sin publicar: Actions > «Publicar versión» > Run workflow. Construye todo con la versión que se indique,
# deja los archivos como artefactos del trabajo y no crea ninguna Release.
#
# Secretos del repositorio (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64   la keystore en base64 (base64 -i release.keystore)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Sin ellos una etiqueta no publica (un APK sin firmar no se instala). En un ensayo manual, si faltan, se firma con una
# keystore desechable generada en el momento y el APK queda marcado como de prueba.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión del ensayo (por ejemplo 0.0.1-rc1). No publica nada."
        required: true
        default: "0.0.1-rc1"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Versión
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "push" ]; then
            version="${REF_NAME#v}"
            publish=true
          else
            version="${INPUT_VERSION#v}"
            publish=false
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Versión no válida: '$version' (se espera 1.2.3 o 1.2.3-rc1)"
            exit 1
          fi
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "publish=$publish"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Versión $version (publicar: $publish, pre-release: $prerelease)"

  # Las mismas pruebas de cada commit, con el túnel real en Windows incluido: si algo falla, no se publica.
  ci:
    name: Pruebas
    uses: ./.github/workflows/ci.yml

  windows:
    name: ProxyUCI.exe
    needs: [version, ci]
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      # kotlin.bat descarga su toolchain con tar: tiene que ser el de Windows y no el de GNU que trae Git.
      - name: Poner el tar de Windows primero
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\Windows\System32"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/tsbridge/go.mod
          cache-dependency-path: tools/tsbridge/go.sum
      # «bash» sería el de WSL (System32 va primero en el PATH): se usa el de Git.
      - name: Librería de Tailscale
        run: |
          & "C:\Program Files\Git\bin\bash.exe" tools/tsbridge/build.sh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Construir el .exe
        run: ./tools/windows-exe/build-exe.ps1 -Version ${{ needs.version.outputs.version }}
      - name: Probar el .exe
        run: ./tools/windows-exe/smoke-test.ps1 -Exe build/exe/ProxyUCI.exe
      - name: Nombrar el archivo
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/exe/ProxyUCI.exe "dist/ProxyUCI-${{ needs.version.outputs.version }}-windows-x64.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: dist/*
          if-no-files-found: error

  macos:
    name: ProxyUCI.dmg
    needs: [version, ci]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      # Sin firmar ni notarizar: macOS pedirá confirmar la primera vez (clic derecho > Abrir).
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/tsbridge/go.mod
          cache-dependency-path: tools/tsbridge/go.sum
      - name: Librería de Tailscale
        run: tools/tsbridge/build.sh
      - name: Construir el .dmg
        run: tools/macos-dmg/build-dmg.sh "${{ needs.version.outputs.version }}" build/dmg
      # La autoprueba ya corrió dentro del script; aquí se abre la ventana de Compose de la app empaquetada.
      - name: Abrir la ventana de la app
        env:
          SKIKO_RENDER_API: SOFTWARE_COMPAT
        run: |
          listo="$RUNNER_TEMP/ventana-lista.txt"
          rm -f "$listo" "$listo.error"
          build/dmg/ProxyUCI.app/Contents/MacOS/ProxyUCI --ready-file "$listo" &
          pid=$!
          for _ in $(seq 90); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then kill "$pid"; fi
          [ -f "$listo.error" ] && { echo "--- error no capturado en la app"; cat "$listo.error"; }
          [ "$(cat "$listo" 2>/dev/null)" = "listo" ] || { echo "::error::La ventana no llegó a componerse en 90 s"; exit 1; }
          echo "La ventana se compuso con la Java recortada"
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: build/dmg/*.dmg
          if-no-files-found: error

  android:
    name: ProxyUCI.apk
    needs: [version, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Versión de Android
        run: python3 tools/release/set-android-version.py "${{ needs.version.outputs.version }}"
      # Un APK sin firmar no se instala: sin la keystore, una etiqueta real falla aquí y no publica nada a medias.
      - name: Claves de firma
        id: claves
        env:
          EVENT: ${{ github.event_name }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            {
              echo "storeFile=$RUNNER_TEMP/release.keystore"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > androidApp/keystore.properties
            echo "modo=real" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            echo "::warning::Faltan los secretos de firma de Android: este ensayo usa una keystore desechable y el APK es de prueba"
            password="$(openssl rand -hex 16)"
            echo "::add-mask::$password"
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=prueba\nkeyPassword=%s\n' \
              "$RUNNER_TEMP/prueba.keystore" "$password" "$password" > androidApp/keystore.properties
            ./kotlin tool generate-keystore --properties-file androidApp/keystore.properties --dn "CN=ProxyUCI prueba"
            echo "modo=prueba" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Faltan los secretos de firma de Android (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD): no se publica un APK sin firmar"
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/tsbridge/go.mod
          cache-dependency-path: tools/tsbridge/go.sum
      - name: Librerías de Tailscale
        run: |
          tools/tsbridge/build.sh android-arm64
          tools/tsbridge/build.sh android-x86_64
      - name: Construir el APK
        run: ./kotlin build -m androidApp -p android -v release
      - name: Verificar y nombrar el APK
        env:
          VERSION: ${{ needs.version.outputs.version }}
          MODO: ${{ steps.claves.outputs.modo }}
        run: |
          apk="$(find build/tasks/_androidApp_buildAndroidRelease -name 'gradle-project-release.apk' | head -1)"
          if [ -z "$apk" ]; then
            echo "::error::No se generó el APK firmado (si solo hay uno «-unsigned», la firma no se aplicó)"
            find build/tasks/_androidApp_buildAndroidRelease -name '*.apk'
            exit 1
          fi
          signer="$(find "${ANDROID_HOME:-/nonexistent}" "$HOME/.cache" "$HOME/.local" -name apksigner -type f 2>/dev/null | sort | tail -1)"
          if [ -n "$signer" ]; then
            "$signer" verify --verbose "$apk" | head -5
          else
            echo "::warning::No encontré apksigner: el APK no se verificó"
          fi
          suffix=""
          [ "$MODO" = "prueba" ] && suffix="-PRUEBA"
          mkdir dist
          cp "$apk" "dist/ProxyUCI-$VERSION-android$suffix.apk"
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: dist/*
          if-no-files-found: error

  publicar:
    name: Publicar la Release
    needs: [version, windows, macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Solo los artefactos de publicación: la ejecución también trae los del ci.yml que corre antes (como el
      # ProxyUCI.exe sin versión de su trabajo de Windows), y no deben acabar en la Release.
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      # Este trabajo corre también en los ensayos manuales, para ejercitar la descarga y las sumas; solo la atestación y
      # la creación de la Release (los pasos con `if`) se saltan cuando no se publica.
      - name: Comprobar que están los tres archivos
        run: |
          cd dist
          ls -l
          for patron in 'ProxyUCI-*-windows-x64.exe' 'ProxyUCI-*-macos-arm64.dmg' 'ProxyUCI-*-android*.apk'; do
            cantidad="$(ls $patron 2>/dev/null | wc -l)"
            [ "$cantidad" = 1 ] || { echo "::error::Se esperaba un archivo $patron y hay $cantidad"; exit 1; }
          done
          # Y nada más: un archivo de sobra acabaría adjunto a la Release.
          total="$(ls | wc -l)"
          [ "$total" = 3 ] || { echo "::error::Se esperaban exactamente 3 archivos y hay $total"; exit 1; }
      - name: Sumas de verificación
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # Quien descargue puede comprobar con `gh attestation verify <archivo> -R drewdev02/Proxy` que salió de este repositorio.
      - uses: actions/attest-build-provenance@v4
        if: ${{ needs.version.outputs.publish == 'true' }}
        with:
          subject-path: "dist/ProxyUCI-*"
      - name: Crear la Release
        if: ${{ needs.version.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ProxyUCI $VERSION" \
            --generate-notes \
            --verify-tag \
            "${flags[@]}"
