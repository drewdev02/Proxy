product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64 ]

# Apoyo para las pruebas de core y de los módulos que dependen de él: dobles (red, túnel, almacenes en memoria) y el
# soporte de las pruebas de Windows. Es código normal de un módulo porque Amper no tiene «test fixtures» para compartir
# código de prueba entre módulos.
dependencies:
  - //core: exported

settings:
  android:
    namespace: org.uci.proxy.core.testing
    minSdk: 26
