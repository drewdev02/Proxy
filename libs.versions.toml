[versions]
logback = "1.6.2"
androidx-activity-compose = "1.13.0"
androidx-lifecycle = "2.11.0"
androidx-navigation3 = "1.2.0"
kotlinx-coroutines = "1.11.0"
ktor = "3.6.1"
jna = "5.19.1"
androidx-core = "1.19.1"
koin = "4.2.2"
slf4j = "2.0.19"

[libraries]
# Inyección de dependencias (solo en paquetes di/ y puntos de entrada)
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }

logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
# Navegación entre pantallas (Navigation 3, versión de JetBrains para Compose Multiplatform) y un ViewModel por pantalla
androidx-navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "androidx-navigation3" }
androidx-lifecycle-viewmodel-navigation3 = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidx-lifecycle" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }

# core (común): corrutinas y sockets TCP/UDP multiplataforma
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
ktor-network = { module = "io.ktor:ktor-network", version.ref = "ktor" }
# Versión 2: proxies HTTPS y SOCKS5 sobre TLS
ktor-network-tls = { module = "io.ktor:ktor-network-tls", version.ref = "ktor" }

# core (solo jvm): Wintun en Windows, utun en macOS, DPAPI
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
jna-platform = { module = "net.java.dev.jna:jna-platform", version.ref = "jna" }
# API de registro; la implementación (Logback) la aporta desktopApp. 2.0.19 es la que trae ktor-network
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

# androidApp: notificación del servicio en primer plano
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
