# Capas 3 y 4: conectar el túnel en Android.
# Para que haya navegación, antes hay que arrancar en el equipo el proxy de pruebas con salida real:
#   python3 tools/test_proxy.py --auth ntlm --port 3128 --upstream
# Deja el túnel conectado para comprobarlo desde fuera de la app:
#   adb shell ping -c 1 cualquier.nombre.test   -> resuelve a una dirección 10.x.1.y
#   adb shell '(printf "GET / HTTP/1.0\r\nHost: example.com\r\n\r\n"; sleep 6) | nc -w 10 example.com 80 | head -1'
#                                               -> HTTP/1.x 200, servido a través del proxy
#   (el sleep mantiene abierto el envío: si nc lo cierra nada más pedir, example.com no contesta, tampoco sin túnel)
# Después se desconecta con tunel-android-desconectar.yaml.
# El emulador debe tener la pantalla encendida. Borra los datos de la app al empezar.
appId: org.uci.proxy
---
- launchApp:
    clearState: true
- tapOn: "Nuevo perfil"
- tapOn: "Nombre"
- inputText: "Pruebas"
- tapOn: "Servidor"
- inputText: "10.0.2.2"
- tapOn: "Puerto"
- inputText: "3128"
- hideKeyboard
- tapOn: "Usuario (opcional)"
- inputText: "andrey"
- hideKeyboard
- tapOn: "Contraseña (opcional)"
- inputText: "secreta7"
- hideKeyboard
- scrollUntilVisible:
    element: "Guardar"
    direction: DOWN
- tapOn: "Guardar"
- assertVisible: "HTTP · 10.0.2.2:3128 · andrey"

- tapOn: "Conectar"
# Primera vez: Android pide autorizar la conexión VPN.
- tapOn:
    text: "OK|Aceptar"
    optional: true
- extendedWaitUntil:
    visible: "Desconectar"
    timeout: 15000
- assertVisible: "Conectado"
