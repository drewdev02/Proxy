# Capa 2: «Probar proxy» contra un proxy real, con sockets de verdad.
#
# Antes de lanzarlo hay que arrancar en el equipo los dos proxies de prueba:
#   python3 tools/test_proxy.py --auth ntlm  --port 3128
#   python3 tools/test_proxy.py --auth basic --port 3129
# Ambos aceptan el usuario «andrey» con la contraseña «secreta7».
# 10.0.2.2 es el equipo anfitrión visto desde el emulador. Borra los datos de la app en cada caso.
appId: org.uci.proxy
env:
  APP_ID: org.uci.proxy
  PROXY_HOST: "10.0.2.2"
---
- runFlow:
    label: "NTLMv2 con la contraseña correcta"
    file: subflows/probar-proxy-caso.yaml
    env:
      PORT: "3128"
      PASSWORD: "secreta7"
      EXPECTED: "Conexión correcta: el proxy aceptó los datos del perfil."
- runFlow:
    label: "NTLMv2 con la contraseña equivocada"
    file: subflows/probar-proxy-caso.yaml
    env:
      PORT: "3128"
      PASSWORD: "equivocada"
      EXPECTED: "El proxy rechazó el usuario o la contraseña."
- runFlow:
    label: "Basic con la contraseña correcta"
    file: subflows/probar-proxy-caso.yaml
    env:
      PORT: "3129"
      PASSWORD: "secreta7"
      EXPECTED: "Conexión correcta: el proxy aceptó los datos del perfil."
- runFlow:
    label: "Basic con la contraseña equivocada"
    file: subflows/probar-proxy-caso.yaml
    env:
      PORT: "3129"
      PASSWORD: "equivocada"
      EXPECTED: "El proxy rechazó el usuario o la contraseña."
- runFlow:
    label: "Puerto donde no escucha nadie"
    file: subflows/probar-proxy-caso.yaml
    env:
      PORT: "3999"
      PASSWORD: "secreta7"
      EXPECTED: "No se pudo conectar con el proxy.*"
