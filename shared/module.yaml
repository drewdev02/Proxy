product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64 ]

# Escritorio y Android comparten lo común del cliente HTTP de la consulta de la cuota (el TLS de Java).
aliases:
  jvmAndAndroid: [ jvm, android ]

dependencies:
  - //core: exported
  - //database
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.androidx.navigation3.ui
  - $libs.androidx.lifecycle.viewmodel.navigation3
  - $kotlin.serialization.json
  - $libs.kotlinx.datetime
  - $libs.koin.compose
  - $libs.koin.compose.viewmodel
  # La cuota de la UCI: un servicio SOAP de la intranet.
  - $libs.ktor.client.core

dependencies@jvm:
  - $libs.ktor.client.java

dependencies@ios:
  - $libs.ktor.client.darwin

dependencies@android:
  - $compose.uiTooling
  - $libs.ktor.client.okhttp

test-dependencies:
  - $libs.koin.test
  - $libs.ktor.client.mock
  - $libs.kotlinx.coroutines.test

# Las pruebas de capturas (CatalogSnapshotTest) dibujan componentes sin ventana: necesitan Skia para el sistema actual.
test-dependencies@jvm:
  - $compose.desktop.currentOs

settings:
  kotlin:
    # Las rutas de navegación son claves serializables: así se guarda la pila al recrear la actividad.
    serialization: enabled
  android:
    minSdk: 26
  compose:
    enabled: true
    resources:
      packageName: org.uci.proxy.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true
